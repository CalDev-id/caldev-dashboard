worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 127.0.0.1:8080;
        server_name localhost 127.0.0.1;

        # Keep the slashless path out of the generic Next.js location.
        location = /terminal {
            add_header Cache-Control "private, no-store" always;
            return 401;
        }

        location = /_terminal_auth {
            internal;
            proxy_pass http://127.0.0.1:3000/api/internal/terminal-auth;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @terminal_auth_unavailable;
            add_header Cache-Control "private, no-store" always;
        }

        # auth_request treats upstream errors as denial; normalize them to 401.
        location @terminal_auth_unavailable {
            internal;
            add_header Cache-Control "private, no-store" always;
            return 401;
        }

        location /terminal/ {
            auth_request /_terminal_auth;
            proxy_pass http://127.0.0.1:7681/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }
    }
}
